<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JD Prestige | Owner Dashboard</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="admin-page">
  <main class="admin-shell">
    <section id="loginPanel" class="admin-card login-card">
      <p class="eyebrow dark">JD PRESTIGE</p>
      <h1 class="admin-title">Owner Login</h1>
      <p class="subtext">Dani and Joviel each have a separate owner account.</p>

      <form id="loginForm">
        <label>
          Username
          <input id="username" autocomplete="username" required>
        </label>

        <label>
          Password
          <input id="password" type="password" autocomplete="current-password" required>
        </label>

        <button class="primary-btn full" type="submit">Sign In</button>
        <p id="loginMessage" class="message" aria-live="polite"></p>
      </form>
    </section>

    <section id="dashboard" class="hidden">
      <div class="dashboard-top">
        <div>
          <p class="eyebrow dark">JD PRESTIGE</p>
          <h1 class="admin-title">Appointments & Payments</h1>
          <p id="signedInAs" class="subtext"></p>
        </div>

        <div class="top-actions">
          <button id="refreshBtn" class="secondary-btn" type="button">Refresh</button>
          <button id="logoutBtn" class="secondary-btn" type="button">Log Out</button>
        </div>
      </div>

      <div class="stats">
        <div><strong id="totalCount">0</strong><span>Shown</span></div>
        <div><strong id="pendingCount">0</strong><span>Pending</span></div>
        <div><strong id="paidCount">0</strong><span>Paid in Full</span></div>
        <div><strong id="dueTotal">$0</strong><span>Total Due</span></div>
      </div>

      <div class="dashboard-controls">
        <label>
          Show appointments for
          <select id="barberFilter">
            <option value="all">All Barbers</option>
            <option value="Dani">Dani</option>
            <option value="Joviel">Joviel</option>
          </select>
        </label>

        <label>
          Appointment status
          <select id="statusFilter">
            <option value="all">All Statuses</option>
            <option>Awaiting Payment</option>
            <option>Pending</option>
            <option>Confirmed</option>
            <option>Completed</option>
            <option>Canceled</option>
          </select>
        </label>

        <label>
          Payment status
          <select id="paymentFilter">
            <option value="all">All Payments</option>
            <option>Unpaid</option>
            <option>Partially Paid</option>
            <option>Paid</option>
          </select>
        </label>
      </div>

      <p id="dashboardMessage" class="message" aria-live="polite"></p>
      <div id="bookingList" class="admin-bookings"></div>
    </section>
  </main>

  <script src="admin.js"></script>
</body>
</html>
